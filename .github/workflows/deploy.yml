name: CI CD Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-lab .

      - name: Run container
        run: docker run -d -p 8000:8000 --name devops-test devops-lab

      - name: Wait for service
        run: sleep 5

      - name: Check service
        run: curl -f http://localhost:8000

      - name: Check metrics
        run: curl -f http://localhost:8000/metrics

      - name: Stop test container
        if: always()
        run: docker rm -f devops-test

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-check

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            git pull
            docker compose up -d --build
            docker compose ps
