name: CI CD Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-check:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-lab .

      - name: Run test container
        run: |
          docker rm -f devops-test || true
          docker run -d -p 8001:8000 --name devops-test devops-lab

      - name: Wait for service
        run: sleep 5

      - name: Check service
        run: curl -f http://localhost:8001

      - name: Check metrics
        run: curl -f http://localhost:8001/metrics

      - name: Stop test container
        if: always()
        run: docker rm -f devops-test || true

  deploy:
    runs-on: self-hosted
    needs: build-and-check

    steps:
      - name: Deploy on local VM
        run: |
          cd ~/devops-lab-service
          git pull
          docker compose up -d --build
          docker compose ps
